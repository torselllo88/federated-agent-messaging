  <text x='686.5' y='100.0' font-family='Helvetica,Arial,sans-serif' font-size='10' text-anchor='start' fill='#666666' font-weight='normal'>1.7794</text>
  <line x1='656.0' y1='126.0' x2='668.5' y2='126.0' stroke='#2f6f9f' stroke-width='2'/>
