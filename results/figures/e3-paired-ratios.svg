  <circle cx='197.2' cy='216.0' r='4' fill='#c2622d'/>
  <text x='176.0' y='220.0' font-family='Helvetica,Arial,sans-serif' font-size='11' text-anchor='end' fill='#1a1a1a' font-weight='normal'>C=32 median observed throughput</text>
  <text x='209.2' y='220.0' font-family='Helvetica,Arial,sans-serif' font-size='10' text-anchor='start' fill='#666666' font-weight='normal'>0.7654</text>
  <text x='20.0' y='26.0' font-family='Helvetica,Arial,sans-serif' font-size='15' text-anchor='start' fill='#1a1a1a' font-weight='600'>Federated relative to local, paired bootstrap</text>
  <text x='20.0' y='44.0' font-family='Helvetica,Arial,sans-serif' font-size='9' text-anchor='start' fill='#666666' font-weight='normal'>point is the paired ratio; bar is the 95% interval over 20 resampled blocks. Latency above 1 is slower; throughput below 1 is fewer completions.</text>
</svg>
