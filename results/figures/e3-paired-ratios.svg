  <line x1='208.3' y1='181.0' x2='208.3' y2='191.0' stroke='#c2622d' stroke-width='2'/>
  <circle cx='206.2' cy='186.0' r='4' fill='#c2622d'/>
  <text x='176.0' y='190.0' font-family='Helvetica,Arial,sans-serif' font-size='11' text-anchor='end' fill='#1a1a1a' font-weight='normal'>C=8 median observed throughput</text>
  <text x='218.3' y='190.0' font-family='Helvetica,Arial,sans-serif' font-size='10' text-anchor='start' fill='#666666' font-weight='normal'>0.7844</text>
