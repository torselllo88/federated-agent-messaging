# Federated Agent Messaging — controlled testbed.
#
# Two independently configured Matrix federation domains, each with its own
# Synapse instance, PostgreSQL instance, signing key, TLS identity,
# configuration and persistent volume (testbed-architecture.md §5).
#
# Privilege separation is expressed here and is part of the C2 evidence:
#   bootstrap  — mounts Synapse data, TLS and secrets; used only by `make setup`
#   toolbox    — runner and agent; NO Synapse data, NO database credentials,
#                NO signing keys, NO server filesystem access

name: fam

networks:
  fam:
    name: fam-net
    # Pinned so the Synapse federation IP whitelist can name this range
    # exactly rather than whitelisting all private address space.
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  synapse-a-data:
  synapse-b-data:
  postgres-a-data:
  postgres-b-data:
  tls:
  secrets:

x-postgres-common: &postgres-common
  image: ${POSTGRES_IMAGE:-postgres:16.4}
  networks: [fam]
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
    interval: 5s
    timeout: 5s
    retries: 30

x-synapse-common: &synapse-common
  image: ${SYNAPSE_IMAGE:-ghcr.io/element-hq/synapse:v1.159.0}
  restart: unless-stopped
  environment:
    SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8008/health || exit 1"]
    interval: 5s
    timeout: 5s
    retries: 60

services:

  # ---------------------------------------------------------------- Domain A

  postgres-a:
    <<: *postgres-common
    container_name: fam-postgres-a
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_A_PASSWORD:-fam-dev-password-a}
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres-a-data:/var/lib/postgresql/data

  synapse-a:
    <<: *synapse-common
    container_name: fam-synapse-a
    depends_on:
      postgres-a:
        condition: service_healthy
    volumes:
      - synapse-a-data:/data
      - tls:/tls:ro
    networks:
      fam:
        aliases:
          - hs-a.test
    ports:
      # Loopback only. The experiments reach this listener over the Compose
      # network, never through the published port, so binding it to the host
      # interface would expose an unencrypted Client-Server API -- including
      # login -- to anything that can route to the machine. On the formal host,
      # which is a public VPS, that is an open door and a standing external
      # interference risk during collection.
      - "127.0.0.1:${HS_A_CS_PORT:-8008}:8008"
      # E4 only, and deliberately public: the HTTPS Client-Server endpoint the
      # external human client connects to (testbed-architecture.md §7). Domain
      # A alone, because that is where the actual human's account lives.
      - "${FAM_E4_CS_TLS_PORT:-8449}:8449"

  # ---------------------------------------------------------------- Domain B

  postgres-b:
    <<: *postgres-common
    container_name: fam-postgres-b
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_B_PASSWORD:-fam-dev-password-b}
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres-b-data:/var/lib/postgresql/data

  synapse-b:
    <<: *synapse-common
    container_name: fam-synapse-b
    depends_on:
      postgres-b:
        condition: service_healthy
    volumes:
      - synapse-b-data:/data
      - tls:/tls:ro
    networks:
      fam:
        aliases:
          - hs-b.test
    ports:
      # Loopback only, as on domain A. Domain B has no external client path.
      - "127.0.0.1:${HS_B_CS_PORT:-8009}:8008"

  # ------------------------------------------------------- Privileged setup

  bootstrap:
    build: .
    image: fam-toolbox:local
    container_name: fam-bootstrap
    profiles: [tools]
    networks: [fam]
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./infrastructure:/app/infrastructure:ro
      - ./results:/app/results:ro
      - synapse-a-data:/synapse/a
      - synapse-b-data:/synapse/b
      - tls:/tls
      - secrets:/secrets
      - ${FAM_RESULTS_DIR:?FAM_RESULTS_DIR must be set}:/results
    environment:
      FAM_RESULTS_DIR: /results
      FAM_ROLE: bootstrap
      FAM_PUBLICATION_DATA: ${FAM_PUBLICATION_DATA:-false}
      FAM_PROTOCOL_GIT_COMMIT: ${FAM_PROTOCOL_GIT_COMMIT:-unknown}
      FAM_EXECUTION_HOST: ${FAM_EXECUTION_HOST:-}
      FAM_HOST_VIRTUALIZATION: ${FAM_HOST_VIRTUALIZATION:-}
      FAM_HOST_DISTRIBUTION: ${FAM_HOST_DISTRIBUTION:-}

  # --------------------------------------- Unprivileged experiment execution
  #
  # No Synapse data volume. No database credentials. No signing keys.
  # This is deliberate and is asserted at run time (C2 evidence).

  toolbox:
    build: .
    image: fam-toolbox:local
    profiles: [tools]
    networks: [fam]
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./experiments:/app/experiments:ro
      - ./tests:/app/tests:ro
      - ./results:/app/results:ro
      - secrets:/secrets:ro
      - ${FAM_RESULTS_DIR:?FAM_RESULTS_DIR must be set}:/results
    environment:
      FAM_RESULTS_DIR: /results
      FAM_ROLE: experiment
      # E4 waits for a person. Buffered stdout makes a prompt invisible and
      # the session look hung, so progress output is unbuffered.
      PYTHONUNBUFFERED: "1"
      FAM_HS_A_NAME: hs-a.test
      FAM_HS_B_NAME: hs-b.test
      FAM_HS_A_CS_URL: http://synapse-a:8008
      FAM_HS_B_CS_URL: http://synapse-b:8008
      # Development by default. A formal run sets this to "true" on the host,
      # which is exactly when the protocol-lock gate becomes load-bearing: a
      # publication run whose effective parameters differ from the committed
      # lock stops before it creates anything (Task 07 §23, §66).
      FAM_PUBLICATION_DATA: ${FAM_PUBLICATION_DATA:-false}
      FAM_PROTOCOL_GIT_COMMIT: ${FAM_PROTOCOL_GIT_COMMIT:-unknown}
      # The formal-run host, not the container. Left empty outside a formal
      # host, where the environment collector falls back to the node name.
      FAM_EXECUTION_HOST: ${FAM_EXECUTION_HOST:-}
