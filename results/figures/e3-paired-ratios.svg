  <line x1='660.0' y1='66' x2='660.0' y2='246' stroke='#d8d8d8' stroke-width='1'/>
  <text x='660.0' y='264.0' font-family='Helvetica,Arial,sans-serif' font-size='10' text-anchor='middle' fill='#666666' font-weight='normal'>1.75</text>
  <line x1='307.5' y1='58' x2='307.5' y2='250' stroke='#444444' stroke-width='1' stroke-dasharray='4 3'/>
  <text x='307.5' y='52.0' font-family='Helvetica,Arial,sans-serif' font-size='9' text-anchor='middle' fill='#666666' font-weight='normal'>no difference</text>
