<svg xmlns='http://www.w3.org/2000/svg' width='720' height='300' viewBox='0 0 720 300' role='img' aria-label='Federated-to-local ratio for each latency percentile and each tested concurrency, with 95% paired bootstrap intervals.'>
  <title>E3 paired ratios with confidence intervals</title>
